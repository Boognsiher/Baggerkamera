; PlatformIO project for an ESP32-CAM (AI-Thinker) WiFi video camera,
; built for mounting inside an RC excavator ("Bagger").
;
; Flash with a USB-TTL adapter:
;   IO0 -> GND while resetting/powering up (puts the board in flash mode)
;   5V/GND -> external 5V supply (the USB adapter's 3V3/5V line usually
;             cannot supply enough current for the camera + WiFi)
;   Remove the IO0-GND jumper and reset after flashing to run normally.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ESP32_SPIRAM_SUPPORT=1
